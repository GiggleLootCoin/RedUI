name: Build RedUI APK

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: redui-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10"

      - name: Prepare bundled offline voice engine
        run: |
          mkdir -p app/libs app/src/main/assets/voices
          wget -q --show-progress --tries=5 --timeout=30 -O app/libs/sherpa-onnx-1.13.8.aar "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar?download=1"
          test -s app/libs/sherpa-onnx-1.13.8.aar
          voices=(
            "lessac|vits-piper-en_US-lessac-medium|en_US-lessac-medium.onnx"
            "amy|vits-piper-en_US-amy-medium|en_US-amy-medium.onnx"
            "cori|vits-piper-en_GB-cori-high|en_GB-cori-high.onnx"
            "alan|vits-piper-en_GB-alan-medium|en_GB-alan-medium.onnx"
            "alba|vits-piper-en_GB-alba-medium|en_GB-alba-medium.onnx"
            "jenny_dioco|vits-piper-en_GB-jenny_dioco-medium|en_GB-jenny_dioco-medium.onnx"
            "northern_english_male|vits-piper-en_GB-northern_english_male-medium|en_GB-northern_english_male-medium.onnx"
            "vctk|vits-piper-en_GB-vctk-medium|en_GB-vctk-medium.onnx"
          )
          for spec in "${voices[@]}"; do
            IFS='|' read -r key dirname modelfile <<< "$spec"
            archive="/tmp/$dirname.tar.bz2"
            unpack="$(mktemp -d)"
            wget -q --show-progress --tries=5 --timeout=30 -O "$archive" "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$dirname.tar.bz2"
            tar -xjf "$archive" --strip-components=1 -C "$unpack"
            test -s "$unpack/$modelfile"
            test -s "$unpack/tokens.txt"
            # espeak-ng-data is identical runtime support data, not voice-specific.
            # Bundle it once instead of duplicating it eight times in the APK.
            if [ "$key" = "lessac" ]; then
              test -s "$unpack/espeak-ng-data/en_dict"
              mkdir -p app/src/main/assets/espeak-ng-data
              cp -a "$unpack/espeak-ng-data/." app/src/main/assets/espeak-ng-data/
            fi
            mkdir -p "app/src/main/assets/voices/$key"
            cp "$unpack/$modelfile" "app/src/main/assets/voices/$key/$modelfile"
            cp "$unpack/tokens.txt" "app/src/main/assets/voices/$key/tokens.txt"
            rm -rf "$unpack" "$archive"
          done
          test -s app/src/main/assets/espeak-ng-data/en_dict
          mkdir -p /tmp/kitten-mini-en-v0_8 app/src/main/assets/kitten-mini
          wget -q --show-progress --tries=5 --timeout=30 -O /tmp/kitten-mini-en-v0_8.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kitten-mini-en-v0_8.tar.bz2"
          tar -xjf /tmp/kitten-mini-en-v0_8.tar.bz2 --strip-components=1 -C /tmp/kitten-mini-en-v0_8
          wget -q --tries=5 --timeout=30 -O /tmp/kitten-mini-en-v0_8/LICENSE "https://raw.githubusercontent.com/KittenML/KittenTTS/main/LICENSE"
          printf '%s\\n' "Kitten TTS Mini 0.8 — KittenML" "Model: KittenML/kitten-tts-mini-0.8" "Eight speakers: Jasper, Bella, Bruno, Luna, Hugo, Rosie, Leo, Kiki" "Model card license: Apache-2.0" "Bundled in RedUI; model weights remain KittenML's." > /tmp/kitten-mini-en-v0_8/README.txt
          test -s /tmp/kitten-mini-en-v0_8/LICENSE
          test -s /tmp/kitten-mini-en-v0_8/model.onnx
          test -s /tmp/kitten-mini-en-v0_8/voices.bin
          test -s /tmp/kitten-mini-en-v0_8/tokens.txt
          cp /tmp/kitten-mini-en-v0_8/model.onnx /tmp/kitten-mini-en-v0_8/voices.bin /tmp/kitten-mini-en-v0_8/tokens.txt /tmp/kitten-mini-en-v0_8/LICENSE /tmp/kitten-mini-en-v0_8/README.txt app/src/main/assets/kitten-mini/
          test -s app/src/main/assets/kitten-mini/model.onnx
          test -s app/src/main/assets/kitten-mini/voices.bin
          test -s app/src/main/assets/kitten-mini/tokens.txt
          test -s app/src/main/assets/kitten-mini/LICENSE

      - name: Install preset lobby background
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp lobby-hero.jpg app/src/main/res/drawable-nodpi/lobby_hero.jpg

      - name: Generate verified offline voice test clips
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "sherpa-onnx==1.13.8"
          mkdir -p /tmp/redui-tts app/src/main/assets/testvoices
          python3 - <<'PY'
          import struct
          import wave
          import urllib.request
          import tarfile
          import os
          import sherpa_onnx

          voices = [
              ("lessac", "vits-piper-en_US-lessac-medium", "en_US-lessac-medium.onnx"),
              ("amy", "vits-piper-en_US-amy-medium", "en_US-amy-medium.onnx"),
              ("cori", "vits-piper-en_GB-cori-high", "en_GB-cori-high.onnx"),
              ("alan", "vits-piper-en_GB-alan-medium", "en_GB-alan-medium.onnx"),
              ("alba", "vits-piper-en_GB-alba-medium", "en_GB-alba-medium.onnx"),
              ("jenny_dioco", "vits-piper-en_GB-jenny_dioco-medium", "en_GB-jenny_dioco-medium.onnx"),
              ("northern_english_male", "vits-piper-en_GB-northern_english_male-medium", "en_GB-northern_english_male-medium.onnx"),
              ("vctk", "vits-piper-en_GB-vctk-medium", "en_GB-vctk-medium.onnx"),
          ]

          root = "/tmp/redui-tts"
          for key, dirname, model_file in voices:
              archive = f"/tmp/{dirname}.tar.bz2"
              url = f"https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/{dirname}.tar.bz2"
              urllib.request.urlretrieve(url, archive)
              with tarfile.open(archive, "r:bz2") as tf:
                  tf.extractall(root, filter="data")
              os.remove(archive)
              base = os.path.join(root, dirname)
              cfg = sherpa_onnx.OfflineTtsConfig(
                  model=sherpa_onnx.OfflineTtsModelConfig(
                      vits=sherpa_onnx.OfflineTtsVitsModelConfig(
                          model=os.path.join(base, model_file),
                          tokens=os.path.join(base, "tokens.txt"),
                          data_dir=os.path.join(base, "espeak-ng-data"),
                      ),
                      num_threads=2,
                      debug=False,
                      provider="cpu",
                  ),
                  max_num_sentences=1,
              )
              if not cfg.validate():
                  raise RuntimeError("Invalid TTS config for " + key)
              tts = sherpa_onnx.OfflineTts(cfg)
              speaker_ids = [95, 82, 60, 102, 98, 81, 97, 93, 5, 92, 79, 76, 84, 104, 57, 107, 90, 74, 94, 1, 17, 0, 48, 87] if key == "vctk" else [0]
              for sid in speaker_ids:
                  audio = tts.generate(
                      "Hello. This is voice sample " + str(sid) + " in Red U I.",
                      sid=sid,
                      speed=1.0,
                  )
                  if not audio.samples:
                      raise RuntimeError("No audio generated for " + key + " speaker " + str(sid))
                  out_name = f"vctk-{sid}.wav" if key == "vctk" else f"{key}.wav"
                  out = f"app/src/main/assets/testvoices/{out_name}"
                  with wave.open(out, "wb") as wf:
                      wf.setnchannels(1)
                      wf.setsampwidth(2)
                      wf.setframerate(audio.sample_rate)
                      frames = bytearray()
                      for sample in audio.samples:
                          sample = max(-1.0, min(1.0, float(sample)))
                          frames.extend(struct.pack("<h", int(sample * 32767.0)))
                      wf.writeframes(frames)
                  print("generated", out)
          PY
          for voice in lessac amy cori alan alba jenny_dioco northern_english_male; do
            test -s "app/src/main/assets/testvoices/$voice.wav"
          done
          for sid in 95 82 60 102 98 81 97 93 5 92 79 76 84 104 57 107 90 74 94 1 17 0 48 87; do
            test -s "app/src/main/assets/testvoices/vctk-$sid.wav"
          done
          cat > app/src/main/assets/voices/vctk/ATTRIBUTION.txt <<'EOF'
          VCTK Piper multi-speaker voice model, 109 speakers.
          Source model: https://huggingface.co/rhasspy/piper-voices/tree/main/en/en_GB/vctk/medium
          Runtime conversion/archive: sherpa-onnx, https://github.com/k2-fsa/sherpa-onnx
          Dataset: CSTR VCTK Corpus 0.92, Centre for Speech Technology Research, University of Edinburgh.
          Dataset authors: Christophe Veaux, Junichi Yamagishi and Kirsten MacDonald.
          Dataset licence: Creative Commons Attribution 4.0 International (CC BY 4.0).
          Bundled in RedUI for offline text-to-speech. Speaker IDs are anonymised; do not attempt to identify speakers.
          EOF
          python3 - <<'PY'
          import os
          import struct
          import wave
          import sherpa_onnx

          root = "/tmp/kitten-mini-en-v0_8"
          cfg = sherpa_onnx.OfflineTtsConfig(
              model=sherpa_onnx.OfflineTtsModelConfig(
                  kitten=sherpa_onnx.OfflineTtsKittenModelConfig(
                      model=os.path.join(root, "model.onnx"),
                      voices=os.path.join(root, "voices.bin"),
                      tokens=os.path.join(root, "tokens.txt"),
                      data_dir=os.path.join(root, "espeak-ng-data"),
                  ),
                  num_threads=1,
                  debug=False,
                  provider="cpu",
              ),
              max_num_sentences=1,
          )
          if not cfg.validate():
              raise RuntimeError("Kitten Mini configuration failed validation")
          tts = sherpa_onnx.OfflineTts(cfg)
          voice_names = ["Jasper", "Bella", "Bruno", "Luna", "Hugo", "Rosie", "Leo", "Kiki"]
          for sid, voice_name in enumerate(voice_names):
              audio = tts.generate("Hello. This is " + voice_name + ", one of the Kitten Mini voices in Red U I.", sid=sid, speed=1.0)
              if not audio.samples:
                  raise RuntimeError("Kitten Mini voice generated no audio: " + str(sid))
              out = f"app/src/main/assets/testvoices/kitten-{sid}.wav"
              with wave.open(out, "wb") as wf:
                  wf.setnchannels(1)
                  wf.setsampwidth(2)
                  wf.setframerate(audio.sample_rate)
                  frames = bytearray()
                  for sample in audio.samples:
                      sample = max(-1.0, min(1.0, float(sample)))
                      frames.extend(struct.pack("<h", int(sample * 32767.0)))
                  wf.writeframes(frames)
              print("generated", out)
          PY
          for sid in 0 1 2 3 4 5 6 7; do
            test -s "app/src/main/assets/testvoices/kitten-$sid.wav"
          done
          test -s app/src/main/res/drawable-nodpi/lobby_hero.jpg
          test -s app/src/main/res/drawable/redui_logo.xml
          for voice in lessac amy cori alan alba jenny_dioco northern_english_male vctk; do
            test -s "app/src/main/assets/voices/$voice/tokens.txt"
          done
          ls -lh app/src/main/assets/testvoices
          rm -rf /tmp/redui-tts /tmp/kitten-mini-en-v0_8 /tmp/kitten-mini-en-v0_8.tar.bz2

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Locate built APK
        run: |
          echo "APK outputs:"
          find app/build/outputs -type f -name "*.apk" -print
          echo "All release outputs:"
          find app/build/outputs -maxdepth 5 -type f -print
          APK=$(find app/build/outputs/apk/release -type f -name "app-arm64-v8a-release.apk" -print -quit)
          test -n "$APK"
          test -f app/src/main/java/com/giggleloot/redui/LocalVault.kt
          test -f app/src/main/java/com/giggleloot/redui/PrivateMediaStore.kt
          grep -q 'PrivateMediaStore.write' app/src/main/java/com/giggleloot/redui/PrivateMediaStore.kt || grep -q 'LocalVault.writeBytes' app/src/main/java/com/giggleloot/redui/PrivateMediaStore.kt
          grep -q 'PrivateMediaStore.importUri' app/src/main/java/com/giggleloot/redui/MainActivity.kt
          grep -q 'PrivateMediaStore.loadBitmap' app/src/main/java/com/giggleloot/redui/ChatAdapter.kt
          grep -q 'AndroidKeyStore' app/src/main/java/com/giggleloot/redui/LocalVault.kt
          grep -q 'AES/GCM/NoPadding' app/src/main/java/com/giggleloot/redui/LocalVault.kt
          grep -q 'LocalVault.writeText' app/src/main/java/com/giggleloot/redui/ChatSessionStore.kt
          grep -q 'LocalVault.writeText' app/src/main/java/com/giggleloot/redui/MemoryStore.kt
          grep -q 'LocalVault.writeText' app/src/main/java/com/giggleloot/redui/UserPersonaStore.kt
          grep -q 'LocalVault.writeText' app/src/main/java/com/giggleloot/redui/CharacterProfileStore.kt
          grep -q 'LocalVault.writeBytes' app/src/main/java/com/giggleloot/redui/CharacterProfileStore.kt
          grep -q 'LocalVault.writeBytes' app/src/main/java/com/giggleloot/redui/ImageStudioActivity.kt
          grep -q 'createOnDeviceSpeechRecognizer' app/src/main/java/com/giggleloot/redui/MainActivity.kt
          grep -q 'class CharacterProfileStore' app/src/main/java/com/giggleloot/redui/CharacterProfileStore.kt
          grep -q 'chara_card_v2' app/src/main/java/com/giggleloot/redui/CharacterProfileStore.kt
          grep -q 'class CharacterStudioActivity' app/src/main/java/com/giggleloot/redui/CharacterStudioActivity.kt
          grep -q 'class UserPersonaStore' app/src/main/java/com/giggleloot/redui/UserPersonaStore.kt
          grep -q 'class MemoryStore' app/src/main/java/com/giggleloot/redui/MemoryStore.kt
          grep -q 'class MemoryStudioActivity' app/src/main/java/com/giggleloot/redui/MemoryStudioActivity.kt
          grep -q 'MemoryStore(this).relevantContext(userPrompt)' app/src/main/java/com/giggleloot/redui/MainActivity.kt
          grep -q 'MemoryStudioActivity' app/src/main/AndroidManifest.xml
          grep -q 'versionCode = 163' app/build.gradle.kts
          grep -q 'UserPersonaStore(this).promptContext()' app/src/main/java/com/giggleloot/redui/MainActivity.kt
          grep -q 'class ImageStudioActivity' app/src/main/java/com/giggleloot/redui/ImageStudioActivity.kt
          grep -q 'class AttachmentReader' app/src/main/java/com/giggleloot/redui/AttachmentReader.kt
          grep -q 'readPdf' app/src/main/java/com/giggleloot/redui/AttachmentReader.kt
          grep -q 'com.google.mlkit:image-labeling:17.0.9' app/build.gradle.kts
          grep -q 'CharacterStudioActivity' app/src/main/AndroidManifest.xml
          grep -q 'ImageStudioActivity' app/src/main/AndroidManifest.xml
          grep -q 'tools:node="remove"' app/src/main/AndroidManifest.xml
          if grep -R -E 'HttpURLConnection|HttpsURLConnection|OkHttpClient|Retrofit|WebView|TextToSpeech|aihorde.net|Galaxy|Samsung|SM-A125|Exynos' app/src/main/java; then
            echo "Unexpected network/remote voice path or device-specific label found in app sources."
            exit 1
          fi
          if grep -R -E 'setImageURI|openInputStream\(Uri\.parse|Intent\.ACTION_VIEW' app/src/main/java; then
            echo "Unexpected automatic external file or browser hand-off found in app sources."
            exit 1
          fi
          echo "Checking APK contains every real bundled TTS model, tokens, espeak data, test WAV, and core assets:"
          unzip -l "$APK" | grep -q "assets/espeak-ng-data/en_dict"
          unzip -l "$APK" | grep -q "assets/kitten-mini/model.onnx"
          unzip -l "$APK" | grep -q "assets/kitten-mini/voices.bin"
          unzip -l "$APK" | grep -q "assets/kitten-mini/tokens.txt"
          unzip -l "$APK" | grep -q "assets/kitten-mini/LICENSE"
          unzip -l "$APK" | grep -q "assets/reds_ways_of_thinking.jsonl"
          unzip -l "$APK" | grep -q "assets/voices/vctk/en_GB-vctk-medium.onnx"
          unzip -l "$APK" | grep -q "assets/voices/vctk/ATTRIBUTION.txt"
          for VOICE in lessac amy cori alan alba jenny_dioco northern_english_male; do
            unzip -l "$APK" | grep -q "assets/voices/$VOICE/"
            unzip -l "$APK" | grep -q "assets/voices/$VOICE/tokens.txt"
            unzip -l "$APK" | grep -q "assets/testvoices/$VOICE.wav"
          done
          unzip -l "$APK" | grep -q "assets/voices/vctk/tokens.txt"
          unzip -l "$APK" | grep -q "assets/voices/vctk/ATTRIBUTION.txt"
          for SID in 0 1 2 3 4 5 6 7; do
            unzip -l "$APK" | grep -q "assets/testvoices/kitten-$SID.wav"
          done
          for SID in 95 82 60 102 98 81 97 93 5 92 79 76 84 104 57 107 90 74 94 1 17 0 48 87; do
            unzip -l "$APK" | grep -q "assets/testvoices/vctk-$SID.wav"
          done
          for MODEL in en_US-lessac-medium.onnx en_US-amy-medium.onnx en_GB-cori-high.onnx en_GB-alan-medium.onnx en_GB-alba-medium.onnx en_GB-jenny_dioco-medium.onnx en_GB-northern_english_male-medium.onnx en_GB-vctk-medium.onnx; do
            unzip -l "$APK" | grep -q "$MODEL"
          done
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'

      - name: Verify release APK is installable and contains every bundled voice
        run: |
          APK=$(find app/build/outputs/apk/release -type f -name "app-arm64-v8a-release.apk" -print -quit)
          test -n "$APK"
          echo "APK: $APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE|CHANGE_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_WIFI_STATE)'; then
            echo "Release APK unexpectedly contains a network permission."
            exit 1
          fi
          unzip -l "$APK" | grep -q "assets/espeak-ng-data/en_dict"
          unzip -l "$APK" | grep -q "assets/kitten-mini/model.onnx"
          unzip -l "$APK" | grep -q "assets/kitten-mini/voices.bin"
          unzip -l "$APK" | grep -q "assets/kitten-mini/tokens.txt"
          unzip -l "$APK" | grep -q "assets/kitten-mini/LICENSE"
          unzip -l "$APK" | grep -q 'assets/testvoices/lessac.wav'
          unzip -l "$APK" | grep -q "assets/voices/vctk/en_GB-vctk-medium.onnx"
          unzip -l "$APK" | grep -q "assets/voices/vctk/tokens.txt"
          unzip -l "$APK" | grep -q "assets/voices/vctk/ATTRIBUTION.txt"
          for VOICE in lessac amy cori alan alba jenny_dioco northern_english_male; do
            unzip -l "$APK" | grep -q "assets/voices/$VOICE/"
            unzip -l "$APK" | grep -q "assets/voices/$VOICE/tokens.txt"
            unzip -l "$APK" | grep -q "assets/testvoices/$VOICE.wav"
          done
          for SID in 0 1 2 3 4 5 6 7; do
            unzip -l "$APK" | grep -q "assets/testvoices/kitten-$SID.wav"
          done
          for SID in 95 82 60 102 98 81 97 93 5 92 79 76 84 104 57 107 90 74 94 1 17 0 48 87; do
            unzip -l "$APK" | grep -q "assets/testvoices/vctk-$SID.wav"
          done
          for MODEL in en_US-lessac-medium.onnx en_US-amy-medium.onnx en_GB-cori-high.onnx en_GB-alan-medium.onnx en_GB-alba-medium.onnx en_GB-jenny_dioco-medium.onnx en_GB-northern_english_male-medium.onnx; do
            unzip -l "$APK" | grep -q "$MODEL"
          done
          echo "All bundled offline voice models, phoneme data, previews, and APK signature verified."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: RedUI-release
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: RedUI v${{ github.run_number }}
          files: |
            app/build/outputs/**/*.apk
          generate_release_notes: true
