name: Build RedUI APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10"

      - name: Install preset lobby background
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp lobby-hero.jpg app/src/main/res/drawable-nodpi/lobby_hero.jpg

      - name: Reuse verified offline voice test clips
        run: |
          mkdir -p app/src/main/assets/testvoices /tmp/redui-v76
          curl -L --fail --retry 3 -o /tmp/redui-v76/redui-v76.apk https://github.com/GiggleLootCoin/RedUI/releases/download/v76/app-arm64-v8a-release.apk
          unzip -j -o /tmp/redui-v76/redui-v76.apk 'assets/testvoices/lessac.wav' 'assets/testvoices/amy.wav' 'assets/testvoices/cori.wav' -d app/src/main/assets/testvoices
          test -s app/src/main/assets/testvoices/lessac.wav
          test -s app/src/main/assets/testvoices/amy.wav
          test -s app/src/main/assets/testvoices/cori.wav
          ls -lh app/src/main/assets/testvoices
          rm -rf /tmp/redui-v76

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Locate built APK
        run: |
          echo "APK outputs:"
          find app/build/outputs -type f -name "*.apk" -print
          echo "All release outputs:"
          find app/build/outputs -maxdepth 5 -type f -print
          APK=$(find app/build/outputs/apk/release -type f -name "app-arm64-v8a-release.apk" -print -quit)
          test -n "$APK"
          echo "Checking APK contains the three safe voice-test WAV files:"
          for ASSET in 'assets/testvoices/lessac.wav' 'assets/testvoices/amy.wav' 'assets/testvoices/cori.wav'; do
            unzip -l "$APK" | grep -q "$ASSET"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: RedUI-release
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: RedUI v${{ github.run_number }}
          files: app/build/outputs/**/*.apk
          generate_release_notes: true
