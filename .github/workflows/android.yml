name: Build RedUI APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10"

      - name: Install preset lobby background
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp lobby-hero.jpg app/src/main/res/drawable-nodpi/lobby_hero.jpg

      - name: Generate safe offline voice test clips
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "sherpa-onnx==1.13.8"
          mkdir -p /tmp/redui-tts app/src/main/assets/testvoices
          for MODEL in vits-piper-en_US-lessac-medium vits-piper-en_US-amy-medium vits-piper-en_GB-cori-medium; do
            curl -L --fail --retry 3 -o "/tmp/$MODEL.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$MODEL.tar.bz2"
            tar -xjf "/tmp/$MODEL.tar.bz2" -C /tmp/redui-tts
          done
          sherpa-onnx-offline-tts --vits-model=/tmp/redui-tts/vits-piper-en_US-lessac-medium/en_US-lessac-medium.onnx --vits-tokens=/tmp/redui-tts/vits-piper-en_US-lessac-medium/tokens.txt --vits-data-dir=/tmp/redui-tts/vits-piper-en_US-lessac-medium/espeak-ng-data --num-threads=2 --output-filename=app/src/main/assets/testvoices/lessac.wav "Hello. This is the Lessac voice in Red U I."
          sherpa-onnx-offline-tts --vits-model=/tmp/redui-tts/vits-piper-en_US-amy-medium/en_US-amy-medium.onnx --vits-tokens=/tmp/redui-tts/vits-piper-en_US-amy-medium/tokens.txt --vits-data-dir=/tmp/redui-tts/vits-piper-en_US-amy-medium/espeak-ng-data --num-threads=2 --output-filename=app/src/main/assets/testvoices/amy.wav "Hello. This is the Amy voice in Red U I."
          sherpa-onnx-offline-tts --vits-model=/tmp/redui-tts/vits-piper-en_GB-cori-medium/en_GB-cori-medium.onnx --vits-tokens=/tmp/redui-tts/vits-piper-en_GB-cori-medium/tokens.txt --vits-data-dir=/tmp/redui-tts/vits-piper-en_GB-cori-medium/espeak-ng-data --num-threads=2 --output-filename=app/src/main/assets/testvoices/cori.wav "Hello. This is the Cori voice in Red U I."
          test -s app/src/main/assets/testvoices/lessac.wav
          test -s app/src/main/assets/testvoices/amy.wav
          test -s app/src/main/assets/testvoices/cori.wav
          ls -lh app/src/main/assets/testvoices
          rm -rf /tmp/redui-tts

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Locate built APK
        run: |
          echo "APK outputs:"
          find app/build/outputs -type f -name "*.apk" -print
          echo "All release outputs:"
          find app/build/outputs -maxdepth 5 -type f -print
          APK=$(find app/build/outputs/apk/release -type f -name "app-arm64-v8a-release.apk" -print -quit)
          test -n "$APK"
          echo "Checking APK contains the three safe voice-test WAV files:"
          for ASSET in 'assets/testvoices/lessac.wav' 'assets/testvoices/amy.wav' 'assets/testvoices/cori.wav'; do
            unzip -l "$APK" | grep -q "$ASSET"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: RedUI-release
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: RedUI v${{ github.run_number }}
          files: app/build/outputs/**/*.apk
          generate_release_notes: true
