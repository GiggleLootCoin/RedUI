name: Build RedUI APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10"

      - name: Prepare bundled offline voice engine
        run: |
          mkdir -p app/libs app/src/main/assets/voices
          wget -q --show-progress --tries=5 --timeout=30 -O app/libs/sherpa-onnx-1.13.8.aar "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar?download=1"
          test -s app/libs/sherpa-onnx-1.13.8.aar
          voices=(
            "lessac|vits-piper-en_US-lessac-medium|en_US-lessac-medium.onnx"
            "amy|vits-piper-en_US-amy-medium|en_US-amy-medium.onnx"
            "cori|vits-piper-en_GB-cori-medium|en_GB-cori-medium.onnx"
            "alan|vits-piper-en_GB-alan-medium|en_GB-alan-medium.onnx"
            "joe|vits-piper-en_US-joe-medium|en_US-joe-medium.onnx"
            "john|vits-piper-en_US-john-medium|en_US-john-medium.onnx"
            "kathleen|vits-piper-en_US-kathleen-low|en_US-kathleen-low.onnx"
            "glados|vits-piper-en_US-glados|en_US-glados.onnx"
          )
          for spec in "${voices[@]}"; do
            IFS='|' read -r key dirname modelfile <<< "$spec"
            wget -q --show-progress --tries=5 --timeout=30 -O "/tmp/$dirname.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$dirname.tar.bz2"
            mkdir -p "app/src/main/assets/voices/$key"
            tar -xjf "/tmp/$dirname.tar.bz2" --strip-components=1 -C "app/src/main/assets/voices/$key"
            test -s "app/src/main/assets/voices/$key/$modelfile"
            test -s "app/src/main/assets/voices/$key/tokens.txt"
            test -d "app/src/main/assets/voices/$key/espeak-ng-data"
            rm -f "/tmp/$dirname.tar.bz2"
          done

      - name: Install preset lobby background
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp lobby-hero.jpg app/src/main/res/drawable-nodpi/lobby_hero.jpg

      - name: Generate verified offline voice test clips
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "sherpa-onnx==1.13.8"
          mkdir -p /tmp/redui-tts app/src/main/assets/testvoices
          python3 - <<'PY'
          import struct
          import wave
          import urllib.request
          import tarfile
          import os
          import sherpa_onnx

          voices = [
              ("lessac", "vits-piper-en_US-lessac-medium", "en_US-lessac-medium.onnx"),
              ("amy", "vits-piper-en_US-amy-medium", "en_US-amy-medium.onnx"),
              ("cori", "vits-piper-en_GB-cori-medium", "en_GB-cori-medium.onnx"),
              ("alan", "vits-piper-en_GB-alan-medium", "en_GB-alan-medium.onnx"),
              ("joe", "vits-piper-en_US-joe-medium", "en_US-joe-medium.onnx"),
              ("john", "vits-piper-en_US-john-medium", "en_US-john-medium.onnx"),
              ("kathleen", "vits-piper-en_US-kathleen-low", "en_US-kathleen-low.onnx"),
              ("glados", "vits-piper-en_US-glados", "en_US-glados.onnx"),
          ]

          root = "/tmp/redui-tts"
          for key, dirname, model_file in voices:
              archive = f"/tmp/{dirname}.tar.bz2"
              url = f"https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/{dirname}.tar.bz2"
              urllib.request.urlretrieve(url, archive)
              with tarfile.open(archive, "r:bz2") as tf:
                  tf.extractall(root, filter="data")
              os.remove(archive)
              base = os.path.join(root, dirname)
              cfg = sherpa_onnx.OfflineTtsConfig(
                  model=sherpa_onnx.OfflineTtsModelConfig(
                      vits=sherpa_onnx.OfflineTtsVitsModelConfig(
                          model=os.path.join(base, model_file),
                          tokens=os.path.join(base, "tokens.txt"),
                          data_dir=os.path.join(base, "espeak-ng-data"),
                      ),
                      num_threads=2,
                      debug=False,
                      provider="cpu",
                  ),
                  max_num_sentences=1,
              )
              if not cfg.validate():
                  raise RuntimeError("Invalid TTS config for " + key)
              tts = sherpa_onnx.OfflineTts(cfg)
              audio = tts.generate(
                  "Hello. This is the " + key + " voice in Red U I.",
                  sid=0,
                  speed=1.0,
              )
              if not audio.samples:
                  raise RuntimeError("No audio generated for " + key)
              out = f"app/src/main/assets/testvoices/{key}.wav"
              with wave.open(out, "wb") as wf:
                  wf.setnchannels(1)
                  wf.setsampwidth(2)
                  wf.setframerate(audio.sample_rate)
                  frames = bytearray()
                  for sample in audio.samples:
                      sample = max(-1.0, min(1.0, float(sample)))
                      frames.extend(struct.pack("<h", int(sample * 32767.0)))
                  wf.writeframes(frames)
              print("generated", out)
          PY
          for voice in lessac amy cori alan joe john kathleen glados; do
            test -s "app/src/main/assets/testvoices/$voice.wav"
          done
          test -s app/src/main/res/drawable-nodpi/lobby_hero.jpg
          test -s app/src/main/res/drawable/redui_logo.xml
          for voice in lessac amy cori alan joe john kathleen glados; do
            test -s "app/src/main/assets/voices/$voice/tokens.txt"
          done
          ls -lh app/src/main/assets/testvoices
          rm -rf /tmp/redui-tts

      - name: Verify bundled voice models are in APK
        run: |
          APK_DIR=app/build/outputs/apk/release
          test -n "$(find "$APK_DIR" -type f -name "app-arm64-v8a-release.apk" -print -quit)" || true

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Locate built APK
        run: |
          echo "APK outputs:"
          find app/build/outputs -type f -name "*.apk" -print
          echo "All release outputs:"
          find app/build/outputs -maxdepth 5 -type f -print
          APK=$(find app/build/outputs/apk/release -type f -name "app-arm64-v8a-release.apk" -print -quit)
          test -n "$APK"
          echo "Checking APK contains every real bundled TTS model, tokens, espeak data, test WAV, and core assets:"
          for VOICE in lessac amy cori alan joe john kathleen glados; do
            unzip -l "$APK" | grep -q "assets/voices/$VOICE/"
            unzip -l "$APK" | grep -q "assets/voices/$VOICE/tokens.txt"
            unzip -l "$APK" | grep -q "assets/voices/$VOICE/espeak-ng-data/"
            unzip -l "$APK" | grep -q "assets/testvoices/$VOICE.wav"
          done
          for MODEL in en_US-lessac-medium.onnx en_US-amy-medium.onnx en_GB-cori-medium.onnx en_GB-alan-medium.onnx en_US-joe-medium.onnx en_US-john-medium.onnx en_US-kathleen-low.onnx en_US-glados.onnx; do
            unzip -l "$APK" | grep -q "$MODEL"
          done
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: RedUI-release
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: RedUI v${{ github.run_number }}
          files: app/build/outputs/**/*.apk
          generate_release_notes: true
