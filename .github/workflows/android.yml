name: Build RedUI APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10"

      - name: Install preset lobby background
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp lobby-hero.jpg app/src/main/res/drawable-nodpi/lobby_hero.jpg

      - name: Add offline local voice engine
        run: |
          mkdir -p app/libs app/src/main/assets/tts
          curl -L --fail --retry 3 -o app/libs/sherpa-onnx-1.13.8.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          for MODEL in             vits-piper-en_GB-semaine-medium-int8             vits-piper-en_GB-cori-medium             vits-piper-en_US-amy-low             vits-piper-en_US-lessac-medium; do
            curl -L --fail --retry 3 -o "/tmp/$MODEL.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$MODEL.tar.bz2"
            tar -xjf "/tmp/$MODEL.tar.bz2" -C app/src/main/assets/tts
            rm "/tmp/$MODEL.tar.bz2"
          done
          echo "Installed offline voice files:"
          find app/src/main/assets/tts -maxdepth 4 -type f -printf '%p %s bytes\n'
          test -s app/src/main/assets/tts/vits-piper-en_GB-semaine-medium-int8/en_GB-semaine-medium-int8.onnx
          test -s app/src/main/assets/tts/vits-piper-en_GB-cori-medium/en_GB-cori-medium.onnx
          test -s app/src/main/assets/tts/vits-piper-en_US-amy-low/en_US-amy-low.onnx
          test -s app/src/main/assets/tts/vits-piper-en_US-lessac-medium/en_US-lessac-medium.onnx
          for DIR in             vits-piper-en_GB-semaine-medium-int8             vits-piper-en_GB-cori-medium             vits-piper-en_US-amy-low             vits-piper-en_US-lessac-medium; do
            test -s "app/src/main/assets/tts/$DIR/tokens.txt"
            test -d "app/src/main/assets/tts/$DIR/espeak-ng-data"
            test "$(find "app/src/main/assets/tts/$DIR/espeak-ng-data" -type f | wc -l)" -gt 0
          done

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Locate built APK
        run: |
          echo "APK outputs:"
          find app/build/outputs -type f -name "*.apk" -print
          echo "All release outputs:"
          find app/build/outputs -maxdepth 5 -type f -print
          APK=$(find app/build/outputs/apk/release -type f -name "app-arm64-v8a-release.apk" -print -quit)
          test -n "$APK"
          echo "Checking APK contains all bundled offline TTS voices:"
          for ASSET in             'assets/tts/vits-piper-en_GB-semaine-medium-int8/en_GB-semaine-medium-int8.onnx'             'assets/tts/vits-piper-en_GB-cori-medium/en_GB-cori-medium.onnx'             'assets/tts/vits-piper-en_US-amy-low/en_US-amy-low.onnx'             'assets/tts/vits-piper-en_US-lessac-medium/en_US-lessac-medium.onnx'; do
            unzip -l "$APK" | grep -q "$ASSET"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: RedUI-release
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: RedUI v${{ github.run_number }}
          files: app/build/outputs/**/*.apk
          generate_release_notes: true
